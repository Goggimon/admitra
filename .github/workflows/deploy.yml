name: Deploy ADMITRA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'data/**'
      - 'calendar/**'
      - 'monitoring/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_run:
    workflows: ['ADMITRA Daily Admissions Update']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Run automated monitoring & ICS tests
        run: npm test
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Validate public JSON & calendar.ics
        run: npm run validate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

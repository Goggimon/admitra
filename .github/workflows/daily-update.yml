name: ADMITRA Daily Admissions Update

on:
  schedule:
    # Once daily at 02:30 UTC (08:00 Asia/Kolkata IST)
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admitra-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run daily source check & generate calendar.ics
        run: npm run update
      - name: Validate JSON database & calendar.ics
        run: npm run validate
      - name: Commit updated public admissions data if changed
        run: |
          git config user.name "admitra-bot"
          git config user.email "admitra-bot@users.noreply.github.com"
          git add data/ apps/web/public/data/ apps/web/public/calendar.ics
          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore(data): daily admissions update [$(date -u +%Y-%m-%d)]"
            git push
          fi
